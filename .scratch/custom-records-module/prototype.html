// ==================== L1: 启发式布局引擎 ====================
function analyzeCardLayout(fields, data, overrides = {}) {
  const roleMap = {};
  fields.forEach(f => { roleMap[f.field_key] = overrides[f.field_key] || 'auto'; });

  const MAIN_KEYWORDS = ['note','review','content','desc','description','text','detail','body','diary','log','dream','thought','feeling','comment','remark','笔记','短评','内容','描述','详情','正文','日记','记录','梦境','想法','感受','评论','备注','食物','food'];
  const TITLE_KEYWORDS = ['title','name','book_name','movie_name','game','place','destination','标题','名称','书名','电影名','游戏名','地点','目的地','dream_theme','dream_title'];
  const HIDDEN_KEYWORDS = ['id','created_at','updated_at','slug','type_id'];

  const getVal = (f) => {
    const v = data[f.field_key];
    return (v === null || v === undefined) ? '' : String(v);
  };

  let hidden = [], chips = [], title = null, main = null;
  fields.forEach(f => {
    const v = getVal(f);
    if (!v) return;
    const role = roleMap[f.field_key];
    if (role === 'hidden' || HIDDEN_KEYWORDS.includes(f.field_key)) { hidden.push(f); return; }
    if (role === 'title') { title = { field:f, value:v }; return; }
    if (role === 'main') { main = { field:f, value:v }; return; }
    if (role === 'chip') { chips.push({ field:f, value:v }); return; }
    const key = f.field_key.toLowerCase();
    const name = f.field_name.toLowerCase();
    const len = v.length;
    if (MAIN_KEYWORDS.some(k => key.includes(k) || name.includes(k))) {
      if (!main && len > 5) { main = { field:f, value:v }; return; }
    }
    if (TITLE_KEYWORDS.some(k => key.includes(k) || name.includes(k))) {
      if (!title) { title = { field:f, value:v }; return; }
    }
    if (len > 25 && !main) { main = { field:f, value:v }; return; }
    if (len <= 20) { chips.push({ field:f, value:v }); return; }
    if (!main) { main = { field:f, value:v }; return; }
    chips.push({ field:f, value:v });
  });

  chips.sort((a,b) => a.value.length - b.value.length);

  let layout = 'note';
  const allChipsShort = chips.every(c => c.value.length < 12);
  if (!main && !title && chips.length <= 5 && allChipsShort) {
    layout = 'tight';
  } else if (!main && !allChipsShort) {
    layout = 'compact';
  }
  return { layout, title, main, chips, hidden };
}

          style={m.active ? {background:m.color} : {}}>
          {m.label}
        </button>
      ))}
    </div>
  </div>
);

// ==================== Sidebar ====================
const Sidebar = () => (
  <div className="fixed left-0 top-12 bottom-0 w-60 bg-white border-r border-gray-100 flex flex-col py-4">
    <div className="px-4 mb-6">
      <div className="flex items-center gap-2 px-3 py-2 rounded-xl bg-gradient-to-r from-cyan-50 to-teal-50 border border-cyan-100">
        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500 to-teal-500 flex items-center justify-center text-white">

        </div>
        <div>
          <div className="text-sm font-semibold text-gray-800">自定义记录</div>

    <nav className="flex-1 px-3 space-y-0.5">
      {[

        { id:'category', label:'分类', icon:'tag' },

// ==================== 模板选择器 ====================
const TemplatePicker = ({ type, onChange }) => {
  const current = type.template || 'clean';
  return (
    <div className="flex items-center gap-1 bg-gray-50 p-1 rounded-xl">
      {Object.values(CARD_TEMPLATES).map(t => (
        <button key={t.id} onClick={() => onChange(t.id)}
          title={`${t.name} · ${t.desc}`}
          className={`relative flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
            current === t.id ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-700'
          }`}>
          <Icon name={t.icon} size={12}/>
          <span>{t.name}</span>
          {current === t.id && (
            <motion.div layoutId="tpl-picker-indicator" className="absolute inset-0 bg-white rounded-lg shadow-sm -z-10"
              transition={{type:'spring',stiffness:500,damping:35}}/>
          )}
        </button>
      ))}
    </div>
  );
};

// ==================== 字段展示设置弹窗 ====================
const FieldRoleModal = ({ type, onClose, onSave }) => {
  const [roles, setRoles] = useState(() => {
    const init = {};
    type.fields.forEach(f => { init[f.field_key] = type.fieldRoles?.[f.field_key] || 'auto'; });
    return init;
  });

  const ROLES = [
    { id:'auto', label:'自动', desc:'AI 决定', icon:'zap' },
    { id:'title', label:'标题', desc:'大字加粗', icon:'type' },
    { id:'main', label:'主体', desc:'正文内容', icon:'fileText' },
    { id:'chip', label:'标签', desc:'彩色chips', icon:'tag' },
    { id:'hidden', label:'隐藏', desc:'不显示', icon:'eyeOff' },
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4" onClick={onClose}>
      <motion.div initial={{opacity:0,scale:0.95}} animate={{opacity:1,scale:1}} exit={{opacity:0,scale:0.95}}
        className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col" onClick={e=>e.stopPropagation()}>
        <div className="p-6 border-b border-gray-100">
          <h3 className="text-lg font-semibold text-gray-900 mb-1">字段展示设置 <span className="text-xs font-normal text-violet-600 bg-violet-50 px-2 py-0.5 rounded ml-2">L2 语义层</span></h3>
          <p className="text-sm text-gray-500">告诉系统每个字段的语义角色，而非写CSS。系统会自动决定字号、颜色、间距。</p>
        </div>
        <div className="flex-1 overflow-y-auto p-6 space-y-4">
          {type.fields.map(f => {
            const color = getFieldColor(f.field_key);
            const currentRole = roles[f.field_key];
            return (
              <div key={f.field_key} className="p-4 rounded-xl bg-gray-50/60 border border-gray-100">
                <div className="flex items-center gap-3 mb-3">
                  <span className={`w-2.5 h-2.5 rounded-full ${color.solid}`}></span>
                  <span className="text-sm font-medium text-gray-800">{f.field_name}</span>
                  <span className="text-xs text-gray-400 font-mono">{f.field_key}</span>
                </div>
                <div className="grid grid-cols-5 gap-1.5">
                  {ROLES.map(r => (
                    <button key={r.id} onClick={() => setRoles({...roles, [f.field_key]: r.id})}
                      className={`flex flex-col items-center gap-1 py-2 px-1 rounded-lg text-[11px] font-medium transition-all ${
                        currentRole === r.id
                          ? `${color.bg} ${color.text} ring-1 ring-current`
                          : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-100'
                      }`}>
                      <Icon name={r.icon} size={14}/>
                      <span>{r.label}</span>
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
        <div className="p-5 border-t border-gray-100 flex items-center justify-between">
          <button onClick={() => { const reset = {}; type.fields.forEach(f => reset[f.field_key]='auto'); setRoles(reset); }}
            className="text-xs text-gray-400 hover:text-gray-600">恢复自动</button>
          <div className="flex items-center gap-2">
            <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100">取消</button>
            <button onClick={() => onSave(roles)} className={`px-4 py-2 rounded-lg text-sm font-medium text-white bg-gradient-to-r ${accentOf(type).grad} shadow-sm`}>保存</button>
          </div>
        </div>
      </motion.div>
    </div>
  );
};

// ==================== 模板效果对比展示 ====================
const TemplateCompareShowcase = ({ type, entry }) => (
  <div className="mb-8 bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <div className="flex items-center gap-2 mb-1">
      <Icon name="flask" size={18} className="text-amber-600"/>
      <h2 className="text-base font-semibold text-gray-900">同一数据 × 五种模板</h2>
    </div>
    <p className="text-xs text-gray-500 mb-5 ml-7">以下是同一条「{type.name}」记录在 5 种视觉模板下的效果，点击顶部卡片的模板切换器可以实时预览。</p>
    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      {Object.keys(CARD_TEMPLATES).map(tid => (
        <div key={tid}>
          <div className="flex items-center gap-2 mb-2 px-1">
            <Icon name={CARD_TEMPLATES[tid].icon} size={13} className="text-gray-400"/>
            <span className="text-xs font-medium text-gray-600">{CARD_TEMPLATES[tid].name}</span>
            <span className="text-[10px] text-gray-400">{CARD_TEMPLATES[tid].desc}</span>
          </div>
          <EntryCard type={type} entry={entry} forceTemplate={tid}/>
        </div>
      ))}
    </div>
  </div>
);

// ==================== 类型列表 ====================
const TypeListPage = ({ onViewType }) => (
  <div className="animate-fade-in">
    <ArchExplainer/>

    <div className="flex items-center justify-between mb-6">
      <div>
        <h1 className="text-2xl font-bold text-gray-900 mb-1">自定义记录</h1>
        <p className="text-sm text-gray-500">每个类型可独立配置字段角色和视觉模板</p>
      </div>
      <div className="flex items-center gap-3">
        <button className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 shadow-sm">
          <Icon name="bot" size={16}/>AI 对话创建
        </button>
        <button className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium text-white bg-gradient-to-r from-cyan-500 to-teal-500 shadow-md shadow-cyan-500/20">
          <Icon name="plus" size={16}/>新建记录类型
        </button>
      </div>
    </div>

    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      {MOCK_TYPES.map((type, idx) => {
        const accent = accentOf(type);
        const tpl = CARD_TEMPLATES[type.template || 'clean'];
        return (
          <motion.div key={type.id}
            initial={{opacity:0,y:12}} animate={{opacity:1,y:0}} transition={{delay:idx*0.04}}
            className="group bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-xl hover:shadow-gray-200/40 hover:border-gray-200 transition-all p-5 cursor-pointer relative overflow-hidden"
            onClick={()=>onViewType(type)}>
            <div className={`absolute top-0 left-0 right-0 h-0.5 ${accent.bg}`}></div>
            <div className="flex items-start justify-between mb-4">
              <div className="flex items-center gap-3">
                <div className={`w-10 h-10 rounded-xl ${accent.light} ${accent.text} flex items-center justify-center`}>
                  <Icon name={type.icon} size={18}/>
                </div>
                <div>
                  <h3 className="text-base font-semibold text-gray-900">{type.name}</h3>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <Icon name={tpl.icon} size={10} className="text-gray-400"/>
                    <span className="text-[11px] text-gray-500">{tpl.name}模板</span>
                  </div>
                </div>
              </div>
            </div>
            <p className="text-xs text-gray-400 font-mono mb-3">custom_{type.slug}</p>
            <div className="flex items-center gap-3 text-xs text-gray-500 mb-3">
              <span className="flex items-center gap-1"><Icon name="list" size={12}/>{type.fields.length} 字段</span>
              <span className="flex items-center gap-1"><Icon name="fileText" size={12}/>{type.entryCount} 条</span>
            </div>
            <div className="flex gap-1 flex-wrap mb-3">
              {type.fields.map(f => {
                const c = getFieldColor(f.field_key);
                return <span key={f.field_key} className={`text-[10px] px-2 py-0.5 rounded-md ${c.bg} ${c.text} border ${c.border}`}>{f.field_name}</span>;
              })}
            </div>
            <div className="pt-3 border-t border-gray-50 flex items-center justify-between">
              <span className="text-[11px] text-gray-400">最近：{type.lastEntry}</span>
              <span className="text-[11px] text-cyan-600 font-medium flex items-center gap-0.5 group-hover:gap-1.5 transition-all">进入 <Icon name="chevronRight" size={12}/></span>
            </div>
          </motion.div>
        );
      })}
    </div>
  </div>
);

// ==================== 类型详情页 ====================
const TypeDetailPage = ({ type, onBack }) => {
  const [view, setView] = useState('card');
  const [showRoles, setShowRoles] = useState(false);
  const [localType, setLocalType] = useState(type);
  const accent = accentOf(localType);
  const entries = MOCK_ENTRIES[localType.id] || [];

  useEffect(() => { setLocalType(type); }, [type]);

  const grouped = useMemo(() => {
    const map = {};
    entries.forEach(e => {
      const date = e.created_at.split(' ')[0];
      if (!map[date]) map[date] = [];
      map[date].push(e);
    });
    return Object.entries(map).sort((a,b) => b[0].localeCompare(a[0]));
  }, [entries]);

  const formatDateHeader = (dateStr) => {
    const d = new Date(dateStr);
    const today = new Date(); today.setHours(0,0,0,0);
    const t = new Date(dateStr); t.setHours(0,0,0,0);
    const diff = Math.round((today-t)/86400000);
    const w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    if (diff===0) return {main:'今天', sub:w};
    if (diff===1) return {main:'昨天', sub:w};
    return {main:`${d.getMonth()+1}月${d.getDate()}日`, sub:w};
  };

  const tabs = [
    { id:'card', label:'卡片', icon:'card' },
    { id:'table', label:'表格', icon:'table' },
    { id:'compare', label:'模板对比', icon:'flask', badge:'DEMO' },
  ];

  return (
    <div className="animate-fade-in">
      <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-800 mb-6"><Icon name="arrowLeft" size={16}/>返回</button>

      <div className="flex items-start justify-between mb-5 flex-wrap gap-4">
        <div className="flex items-center gap-3">
          <div className={`w-12 h-12 rounded-2xl ${accent.light} ${accent.text} flex items-center justify-center`}>
            <Icon name={localType.icon} size={22}/>
          </div>
          <div>
            <h1 className="text-2xl font-bold text-gray-900">{localType.name}</h1>
            <div className="flex items-center gap-3 mt-0.5">
              <p className="text-xs text-gray-400 font-mono">custom_{localType.slug}</p>
              <span className="text-gray-300">·</span>
              <p className="text-xs text-gray-500">{localType.entryCount} 条记录</p>
              <span className="text-gray-300">·</span>
              <div className="flex items-center gap-1 text-xs text-gray-500">
                <Icon name={CARD_TEMPLATES[localType.template||'clean'].icon} size={11}/>
                <span>{CARD_TEMPLATES[localType.template||'clean'].name}模板</span>
              </div>
            </div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <TemplatePicker type={localType} onChange={(tpl) => setLocalType({...localType, template: tpl})}/>
          <button onClick={()=>setShowRoles(true)}
            className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-medium text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 shadow-sm">
            <Icon name="sliders" size={14}/>字段角色
          </button>
          <button className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium text-white bg-gradient-to-r ${accent.grad} shadow-sm`}>
            <Icon name="bot" size={14}/>AI 录入
          </button>
        </div>
      </div>

      {/* 字段chips */}
      <div className="mb-5 flex items-center gap-2 flex-wrap">
        {localType.fields.map(f => {
          const c = getFieldColor(f.field_key);
          const role = localType.fieldRoles?.[f.field_key] || 'auto';
          return (
            <span key={f.field_key} className={`text-xs px-2.5 py-1 rounded-lg ${c.bg} ${c.text} border ${c.border} flex items-center gap-1.5`}>
              <span className={`w-1.5 h-1.5 rounded-full ${c.dot}`}></span>
              {f.field_name}
              {role !== 'auto' && <span className="text-[9px] opacity-50 uppercase">· {role}</span>}
            </span>
          );
        })}
      </div>

      {/* Tab 栏 */}
      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-3 mb-5 flex items-center gap-3 flex-wrap">
        <div className="relative flex items-center gap-1 bg-gray-50 p-1 rounded-xl">
          {tabs.map(t => (
            <button key={t.id} onClick={()=>setView(t.id)}
              className={`relative z-10 flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all ${view===t.id?'text-gray-900':'text-gray-500 hover:text-gray-700'}`}>
              <Icon name={t.icon} size={13}/>{t.label}
              {t.badge && <span className="text-[9px] font-bold px-1 py-0.5 rounded bg-amber-100 text-amber-600">{t.badge}</span>}
              {view===t.id && <motion.div layoutId="tab-detail" className="absolute inset-0 bg-white rounded-lg shadow-sm border border-gray-100 -z-0" transition={{type:'spring',stiffness:500,damping:35}}/>}
            </button>
          ))}
        </div>
        <div className="flex-1"></div>
        <span className="text-xs text-gray-400 px-2">{entries.length} 条</span>
      </div>

      <AnimatePresence mode="wait">
      {/* === 卡片视图 === */}
      {view === 'card' && (
        <motion.div key="card" initial={{opacity:0,y:6}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-6}} className="space-y-8">
          {grouped.map(([date, dayEntries]) => {
            const dh = formatDateHeader(date);
            return (
              <div key={date}>
                <div className="flex items-center gap-3 mb-4 sticky top-0 z-10 bg-[#F7F8FA]/95 backdrop-blur py-2 -mx-2 px-2">
                  <div className={`w-10 h-10 rounded-xl ${accent.light} ${accent.text} flex flex-col items-center justify-center leading-none`}>
                    <span className="text-[10px] font-medium">{dh.sub}</span>
                    <span className="text-sm font-bold mt-0.5">{dh.main==='今天'||dh.main==='昨天'?dh.main:dh.main.split('月')[1].replace('日','')}</span>
                  </div>
                  <div>
                    <div className="text-sm font-semibold text-gray-800">{dh.main}</div>
                    <div className="text-xs text-gray-400">{date} · {dayEntries.length} 条</div>
                  </div>
                  <div className="flex-1 h-px bg-gradient-to-r from-gray-200 to-transparent ml-2"></div>
                </div>
                <div className={`grid gap-4 ${localType.template==='minimal'?'grid-cols-1 max-w-2xl':'grid-cols-1 md:grid-cols-2'}`}>
                  {dayEntries.map(e => (
                    <EntryCard key={e.id} type={localType} entry={e}/>
                  ))}
                </div>
              </div>
            );
          })}
        </motion.div>
      )}

      {/* === 表格视图 === */}
      {view === 'table' && (
        <motion.div key="table" initial={{opacity:0,y:6}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-6}}
          className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-gray-50/80 border-b border-gray-100">
                  {localType.fields.map(f=><th key={f.field_key} className="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider whitespace-nowrap">{f.field_name}</th>)}
                  <th className="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">时间</th>
                </tr>
              </thead>
              <tbody>
                {entries.map(e=>(
                  <tr key={e.id} className="border-b border-gray-50 last:border-0 hover:bg-gray-50/50">
                    {localType.fields.map(f=><td key={f.field_key} className="px-5 py-3.5 text-gray-700">{e.data[f.field_key]||<span className="text-gray-300">—</span>}</td>)}
                    <td className="px-5 py-3.5 text-gray-400 text-xs">{e.created_at.split(' ')[1]}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </motion.div>
      )}

      {/* === 模板对比视图 === */}
      {view === 'compare' && entries[0] && (
        <motion.div key="compare" initial={{opacity:0,y:6}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-6}}>
          <TemplateCompareShowcase type={localType} entry={entries[0]}/>
        </motion.div>
      )}
      </AnimatePresence>

      {/* 字段设置弹窗 */}
      <AnimatePresence>
        {showRoles && (
          <FieldRoleModal type={localType} onClose={()=>setShowRoles(false)}
            onSave={(roles)=>{ setLocalType({...localType, fieldRoles: roles}); setShowRoles(false); }}/>
        )}
      </AnimatePresence>
    </div>
  );
};

// ==================== App ====================
const App = () => {
  const [page, setPage] = useState('type-list');
  const [selectedType, setSelectedType] = useState(null);

  return (
    <div className="min-h-screen">
      <ModuleDock/>
      <Sidebar/>
      <main className="ml-60 mt-12 p-8 pb-20">
        <AnimatePresence mode="wait">
          {page==='type-list' && <TypeListPage key="list"
            onViewType={(t)=>{setSelectedType(t);setPage('type-detail');}}/>}
          {page==='type-detail' && selectedType && <TypeDetailPage key="detail"
            type={selectedType} onBack={()=>setPage('type-list')}/>}
        </AnimatePresence>
      </main>
      <button className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gradient-to-br from-cyan-500 to-teal-500 text-white shadow-lg shadow-cyan-500/30 flex items-center justify-center hover:scale-105 transition-transform z-40">
        <Icon name="bot" size={22}/>
      </button>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
