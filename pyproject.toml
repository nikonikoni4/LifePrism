# pyproject.toml - LifePrism 项目配置

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeprism"
version = "0.3.1"
description = "AI-powered software monitoring and classification system"
requires-python = ">=3.12"

# 项目依赖
dependencies = [
    "requests>=2.25.0",
    "fastapi",
    "keyring",
    "uvicorn",
    "tomlkit",
    "langchain_community",
    "langchain",
    "dashscope",

    "pandas",
    "pydantic",
    "python-multipart",
    # LLM & LangChain
    "langchain-core",
    "langchain-openai",
    # LangGraph 会话持久化依赖
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite==0.21.0",  # 注意：0.22.x 与 langgraph-checkpoint-sqlite 不兼容
    "mss>=9.0.1",
    "pynput>=1.7.7",
    "apscheduler>=3.10.0",
    "pytz",
    "json_repair",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "tiktoken>=0.5.0",
    "litellm>=1.50.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "qrcode>=7.4.0",
    "typing-extensions>=4.8.0",
    "asyncssh>=2.14.0",
    # 外部 Agent 执行内核（开发期通过 [tool.uv.sources] 以本地路径 editable 引入）
    "myagent==0.1.0",
    "simple-rag==0.1.0",
    "sqlite-vec==0.1.6",
]

# 可选依赖
[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["lifeprism*"]
exclude = ["lifeprism.llm.deprecated_agent*"]

# 开发期 myagent 指向本地 ../agent 目录（editable），正式发布时移除此覆盖即可从索引安装
[tool.uv.sources]
myagent = { path = '../agent' }
simple-rag = { path = '../RAG }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "frontend",
    ".claude",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — formatter handles
    "B008",  # function calls in defaults (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["B", "SIM"]
"lifeprism/server/main.py" = ["E402"]
"lifeprism/repository/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["lifeprism"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = [
    "test",
    "build",
]
