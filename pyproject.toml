# pyproject.toml - LifePrism 项目配置

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeprism"
version = "0.1.3"
description = "AI-powered software monitoring and classification system"
requires-python = ">=3.8"

# 项目依赖
dependencies = [
    "requests>=2.25.0",
    "fastapi",
    "keyring",
    "uvicorn",
    "tomlkit",
    "langchain_community",
    "langchain",
    "dashscope",
    "toon_python",
    "pandas",
    "pydantic",
    "python-multipart",
    # LLM & LangChain
    "langchain-core",
    "langchain-openai",
    # LangGraph 会话持久化依赖
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite==0.21.0",  # 注意：0.22.x 与 langgraph-checkpoint-sqlite 不兼容
    "mss>=9.0.1",
    "pynput>=1.7.7",
    "apscheduler>=3.10.0",
]

# 可选依赖
[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]
[tool.setuptools]
packages = ["lifeprism"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "frontend",
    ".claude",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — formatter handles
    "B008",  # function calls in defaults (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["lifeprism"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = [
    "test",
    "build",
]
