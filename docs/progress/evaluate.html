<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 评估体系分类树 · LifeWatch</title>
<style>
:root{
  --paper:#f6f2e9;
  --ink:#262118;
  --ink-soft:#4a4335;
  --muted:#7d7460;
  --hairline:#d8cfba;
  --tick:#c2b79d;
  --dot:#c7bda2;
  --accent:#a2401f;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:"Cascadia Code","SF Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.75 var(--sans)}
::selection{background:var(--accent);color:var(--paper)}
.page{max-width:820px;margin:0 auto;padding:64px 28px 72px}

/* ---------- 报头 ---------- */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
h1{font-family:var(--serif);font-size:clamp(34px,6vw,46px);font-weight:700;line-height:1.2;letter-spacing:.04em}
.standfirst{margin-top:14px;font-size:14px;color:var(--muted);max-width:58ch;text-wrap:pretty}
.rule-double{height:6px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:26px}
.colophon{margin-top:14px;font-size:12.5px;letter-spacing:.06em;color:var(--ink-soft)}
.colophon b{font-variant-numeric:tabular-nums}
.colophon .p0n{color:var(--accent);font-weight:600}
.colophon .p1n{color:var(--muted);font-weight:600}
.legend{margin-top:4px;font-size:12px;color:var(--muted)}

/* ---------- 工具条 ---------- */
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 24px;margin-top:30px;padding:9px 0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.grp{display:flex;align-items:baseline;gap:10px}
.toolbar button{appearance:none;background:none;border:none;border-bottom:1px solid transparent;padding:0 1px 2px;font:12.5px/1.4 var(--sans);letter-spacing:.05em;color:var(--ink-soft);cursor:pointer}
.toolbar button:hover{color:var(--accent)}
.toolbar button.on{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar button.ghost{color:var(--muted)}
.toolbar .sep{color:var(--tick);font-size:12px}

/* ---------- 分章 ---------- */
.part{margin-top:54px}
.part:first-of-type{margin-top:42px}
.part-head{display:flex;align-items:baseline;gap:14px}
.part-no{font-family:var(--serif);font-size:24px;line-height:1;color:var(--accent)}
.part-info h2{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.06em;line-height:1.3}
.part-info p{font-size:12.5px;color:var(--muted);margin-top:2px}
.part-count{margin-left:auto;font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.part .rule-double{margin-top:14px}

/* ---------- workflow 小节 ---------- */
.workflow{margin-top:28px}
.wf-head{display:flex;gap:12px;cursor:pointer;user-select:none}
.wf-head:focus-visible{outline:1px dashed var(--accent);outline-offset:4px}
.toggle{flex:none;width:20px;height:20px;margin-top:5px;padding:0;border:1px solid var(--tick);background:transparent;color:var(--ink-soft);font:13px/18px var(--sans);text-align:center;cursor:pointer}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.wf-info h3{font-family:var(--serif);font-size:17.5px;font-weight:700;letter-spacing:.02em}
.tasks{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.9;word-break:break-all}
.tasks .sep{color:var(--tick);margin:0 6px}
.wf-count{margin-left:auto;font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:4px}
.workflow.collapsed .items{display:none}

/* ---------- 指标条目 ---------- */
.items{list-style:none;margin:8px 0 0 2px;padding-left:18px;border-left:1px solid var(--hairline)}
.item{position:relative;padding:10px 0 10px 16px}
.item::before{content:"";position:absolute;left:-18px;top:24px;width:12px;border-top:1px solid var(--tick)}
.row{display:flex;align-items:baseline;gap:0}
.name{font-family:var(--serif);font-size:16px}
.leader{flex:1;min-width:24px;margin:0 10px;border-bottom:1px dotted var(--dot);transform:translateY(-4px)}
.prio{flex:none;font-size:11px;font-weight:600;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.prio.p0{color:var(--accent)}
.prio.p1{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:1px;text-wrap:pretty}

/* ---------- 页脚 ---------- */
.rule-foot{border-top:1px solid var(--hairline);margin-top:64px}
footer p{margin-top:14px;font-size:12px;letter-spacing:.04em;color:var(--muted)}

@media (max-width:560px){
  .page{padding:44px 18px 56px}
  .part-head{gap:10px}
  .part-count,.wf-count{display:none}
  .toolbar{justify-content:flex-start}
}
@media print{
  .toolbar{display:none}
  body{background:#fff}
  .workflow.collapsed .items{display:block}
}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <p class="eyebrow">LifeWatch · Agent Evaluation Framework</p>
    <h1>评估体系分类树</h1>
    <p class="standfirst">LLM Agent 评估任务的类型结构：按「通用指标、业务场景、跨场景统计」三个维度组织，逐项标注实施优先级。本页仅呈现分类，不含评估结果数据。</p>
    <div class="rule-double"></div>
    <p class="colophon" id="colophon"></p>
    <p class="legend">P0 立即可做（完全自动化） · P1 两周内（需人工标注或 LLM 辅助） · P2 长期规划（需构建评估基础设施）</p>
  </header>

  <nav class="toolbar" aria-label="筛选与视图">
    <div class="grp" id="filters">
      <button data-filter="all" class="on">全部</button>
      <span class="sep">·</span>
      <button data-filter="P0" id="btn-p0">仅 P0</button>
      <span class="sep">·</span>
      <button data-filter="P1" id="btn-p1">仅 P1</button>
    </div>
    <div class="grp">
      <button id="expand-all" class="ghost">全部展开</button>
      <span class="sep">·</span>
      <button id="collapse-all" class="ghost">全部折叠</button>
    </div>
  </nav>

  <main id="tree"></main>

  <footer>
    <div class="rule-foot"></div>
    <p>整理自 agent_evaluation_task.md（创建于 2026-06-30）· 点击业务场景标题行可折叠该组 · 本页仅呈现分类结构，不含评估结果</p>
  </footer>

</div>

<script>
const DATA = [
  {
    no: "壹",
    name: "通用场景",
    desc: "适用所有 LLM 任务的基础指标",
    items: [
      { name: "Token 效率", prio: "P0", note: "token 消耗均值与波动、输入输出比、成本估算、离群值" },
      { name: "错误率", prio: "P0", note: "节点错误率（含 LLM 调用）、超时 / 参数错误 / 模型拒绝占比" },
      { name: "延迟", prio: "P0", note: "平均延迟、P95 / P99 延迟、超时次数" },
      { name: "格式正确性", prio: "P0", note: "JSON 有效率、字段完整率、值类型与枚举合法率" },
    ],
  },
  {
    no: "贰",
    name: "业务场景",
    desc: "针对特定 workflow 的专项指标",
    workflows: [
      {
        name: "dreaming workflow",
        tasks: ["summary_activities", "summary_moods", "extract_from_chat_messages", "update_memory"],
        items: [
          { name: "格式遵循度", prio: "P0", note: "正确格式率（序号格式）/ 错误格式率（Markdown 标题）" },
          { name: "幻觉率", prio: "P1", note: "防止编造不存在的活动；检测方法论待讨论" },
          { name: "输出完整性", prio: "P0", note: "按节点模板检查必需字段与章节" },
          { name: "工具调用成功率", prio: "P0", note: "仅 update_memory；成功率、失败工具分布、参数错误率" },
        ],
      },
      {
        name: "screenshot_analysis workflow",
        tasks: ["analyze_chunk_screenshots", "_behavior_summary"],
        items: [
          { name: "图片识别准确率", prio: "P1", note: "行为准确率、误识率、漏识率；人工抽样加 LLM 辅助评分" },
          { name: "格式正确性", prio: "P0", note: "JSON 有效率、title 与 summary 字段完整率" },
          { name: "字数控制", prio: "P0", note: "title 不超 30 字、summary 不超 150 字" },
          { name: "ignore 过滤准确率", prio: "P1", note: "忽略率、误忽略率、误保留率" },
        ],
      },
      {
        name: "diary_summary workflow",
        tasks: ["ai_diary_summary"],
        items: [
          { name: "摘要质量", prio: "P1", note: "忠实度评分、信息保留率、过度简化率" },
          { name: "字数控制", prio: "P0", note: "超限率、压缩率、平均长度" },
          { name: "标签整合", prio: "P0", note: "mood / importance / custom_label 整合率" },
        ],
      },
      {
        name: "classify workflow",
        tasks: ["get_app_description", "single_classify", "multi_classify_short", "multi_classify_long", "get_titles"],
        items: [
          { name: "分类准确率", prio: "P1", note: "总体、category、sub_category 准确率与混淆类别对" },
          { name: "link_to_goal 准确率", prio: "P1", note: "关联准确率、误判率（假阳性）、漏判率（假阴性）" },
          { name: "null 分类率", prio: "P0", note: "category / sub_category 为 null 的比例与趋势" },
          { name: "描述质量", prio: "P1", note: "字数合规率、描述缺失率、重试率（get_app_description）" },
          { name: "分类器对比", prio: "P1", note: "classify_simple 与 classify_graph 的准确率、token、延迟、null 率" },
        ],
      },
      {
        name: "chat agent",
        tasks: ["ChatBot.chat"],
        items: [
          { name: "工具路由准确率", prio: "P1", note: "路由准确率、工具间混淆矩阵、未选工具率" },
          { name: "参数提取正确率", prio: "P1", note: "参数完整率、参数正确率、时间解析准确率" },
          { name: "工具调用成功率", prio: "P0", note: "成功率、失败工具分布、参数错误占比" },
          { name: "幻觉率", prio: "P1", note: "FAQ 准确率、编造率、一致性（需先实现功能说明 skill）" },
          { name: "知识边界感知", prio: "P1", note: "拒绝准确率、误拒率" },
        ],
      },
    ],
  },
  {
    no: "叁",
    name: "跨场景评估",
    desc: "从工具本身角度统计，区分「工具问题」与「场景使用问题」",
    items: [
      { name: "工具调用统计", prio: "P0", note: "工具总成功率、单工具成功率、调用频率 Top 10、失败原因排行" },
    ],
  },
];

/* ---------- 渲染 ---------- */
function itemHTML(it) {
  return `<li class="item" data-priority="${it.prio}">
    <div class="row">
      <span class="name">${it.name}</span>
      <span class="leader" aria-hidden="true"></span>
      <span class="prio ${it.prio.toLowerCase()}">${it.prio}</span>
    </div>
    <p class="note">${it.note}</p>
  </li>`;
}

function wfHTML(wf) {
  const tasks = wf.tasks.map(t => `<span class="tk">${t}</span>`).join('<span class="sep">·</span>');
  return `<div class="workflow">
    <div class="wf-head" role="button" tabindex="0" aria-expanded="true">
      <button class="toggle" aria-label="折叠或展开">−</button>
      <div class="wf-info">
        <h3>${wf.name}</h3>
        <p class="tasks">${tasks}</p>
      </div>
      <span class="wf-count">${wf.items.length} 项</span>
    </div>
    <ul class="items">${wf.items.map(itemHTML).join("")}</ul>
  </div>`;
}

function partHTML(p) {
  const body = p.workflows
    ? p.workflows.map(wfHTML).join("")
    : `<ul class="items">${p.items.map(itemHTML).join("")}</ul>`;
  const count = p.workflows
    ? `${p.workflows.length} 个 workflow · ${p.workflows.reduce((n, w) => n + w.items.length, 0)} 项`
    : `${p.items.length} 项`;
  return `<section class="part">
    <header class="part-head">
      <span class="part-no" aria-hidden="true">${p.no}</span>
      <div class="part-info"><h2>${p.name}</h2><p>${p.desc}</p></div>
      <span class="part-count">${count}</span>
    </header>
    <div class="rule-double"></div>
    ${body}
  </section>`;
}

document.getElementById("tree").innerHTML = DATA.map(partHTML).join("");

/* ---------- 统计 ---------- */
const allItems = DATA.flatMap(p => p.workflows ? p.workflows.flatMap(w => w.items) : p.items);
const wfCount = DATA.flatMap(p => p.workflows || []).length;
const p0 = allItems.filter(i => i.prio === "P0").length;
const p1 = allItems.filter(i => i.prio === "P1").length;

document.getElementById("colophon").innerHTML =
  `<b>${DATA.length}</b> 大维度 · <b>${wfCount + 2}</b> 个板块 · <b>${allItems.length}</b> 项指标 —— ` +
  `<span class="p0n">P0 × ${p0}</span> · <span class="p1n">P1 × ${p1}</span>`;
document.getElementById("btn-p0").textContent = `仅 P0（${p0}）`;
document.getElementById("btn-p1").textContent = `仅 P1（${p1}）`;

/* ---------- 折叠 / 展开 ---------- */
const tree = document.getElementById("tree");

tree.addEventListener("click", e => {
  const head = e.target.closest(".wf-head");
  if (!head) return;
  setCollapsed(head.parentElement, head.parentElement.classList.contains("collapsed") ? false : true);
});

tree.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("wf-head")) {
    e.preventDefault();
    setCollapsed(e.target.parentElement, !e.target.parentElement.classList.contains("collapsed"));
  }
});

function setCollapsed(wf, collapsed) {
  wf.classList.toggle("collapsed", collapsed);
  const head = wf.querySelector(".wf-head");
  head.setAttribute("aria-expanded", String(!collapsed));
  wf.querySelector(".toggle").textContent = collapsed ? "+" : "−";
}

document.getElementById("expand-all").addEventListener("click", () => {
  document.querySelectorAll(".workflow").forEach(wf => setCollapsed(wf, false));
});
document.getElementById("collapse-all").addEventListener("click", () => {
  document.querySelectorAll(".workflow").forEach(wf => setCollapsed(wf, true));
});

/* ---------- 优先级筛选 ---------- */
function applyFilter(f) {
  document.querySelectorAll(".item").forEach(li => {
    li.hidden = f !== "all" && li.dataset.priority !== f;
  });
  document.querySelectorAll(".workflow").forEach(wf => {
    wf.hidden = wf.querySelectorAll(".item:not([hidden])").length === 0;
  });
  document.querySelectorAll(".part").forEach(p => {
    p.hidden = p.querySelectorAll(".item:not([hidden])").length === 0;
  });
}

const filterBtns = document.querySelectorAll("#filters button");
filterBtns.forEach(btn => btn.addEventListener("click", () => {
  filterBtns.forEach(b => b.classList.toggle("on", b === btn));
  applyFilter(btn.dataset.filter);
}));
</script>
</body>
</html>
